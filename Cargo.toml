[package]
name = "jsonl-v"
version = "0.1.5"
edition = "2021"
license = "MIT"

[dependencies]
# 关掉默认的 accesskit 特性：egui 0.31 的无障碍树 diff 有 bug，
# 窗口 id 变化（如弹窗全屏切换）时 accesskit_consumer 会 unwrap None 崩溃，
# 上游在兼容版本内未修；代价是失去屏幕阅读器支持
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui = "0.31"
serde_json = "1"
memchr = "2"
rfd = "0.15"
sys-locale = "0.3"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
