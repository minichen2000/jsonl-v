[package]
name = "jsonl-v"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde_json = "1"
memchr = "2"
rfd = "0.15"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
