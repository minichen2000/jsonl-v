name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: jsonl-v.exe
            asset_name: windows-x86_64
            archive: zip
          - os: macos-latest
            artifact: jsonl-v
            asset_name: macos-aarch64
            archive: tar.gz
          - os: ubuntu-latest
            artifact: jsonl-v
            asset_name: linux-x86_64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "jsonl-v-$tag-${{ matrix.asset_name }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "target/release/${{ matrix.artifact }}" "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tag="${GITHUB_REF_NAME}"
          name="jsonl-v-${tag}-${{ matrix.asset_name }}"
          mkdir -p "dist/${name}"
          cp "target/release/${{ matrix.artifact }}" "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
